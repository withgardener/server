name: Build OpenResty Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/withgardener/server

jobs:
  prepare:
    name: Read version from Dockerfile
    runs-on: ubuntu-latest
    outputs:
      resty_version: ${{ steps.vars.outputs.resty_version }}
      resty_release: ${{ steps.vars.outputs.resty_release }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract RESTY_VERSION and RESTY_RELEASE
        id: vars
        shell: bash
        run: |
          RESTY_VERSION=$(sed -n 's/^ARG RESTY_VERSION="\([^"]*\)"/\1/p' Dockerfile | head -n1)
          RESTY_RELEASE=$(sed -n 's/^ARG RESTY_RELEASE="\([^"]*\)"/\1/p' Dockerfile | head -n1)

          if [ -z "$RESTY_VERSION" ] || [ -z "$RESTY_RELEASE" ]; then
            echo "Failed to parse RESTY_VERSION or RESTY_RELEASE from Dockerfile"
            exit 1
          fi

          echo "resty_version=$RESTY_VERSION" >> "$GITHUB_OUTPUT"
          echo "resty_release=$RESTY_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=${RESTY_VERSION}.${RESTY_RELEASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    needs:
      - prepare

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RESTY_VERSION=${{ needs.prepare.outputs.resty_version }}
            RESTY_RELEASE=${{ needs.prepare.outputs.resty_release }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-amd64
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=openresty-amd64
          cache-to: type=gha,mode=max,scope=openresty-amd64
